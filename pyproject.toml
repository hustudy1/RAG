[project]
name = "rag"
version = "0.1.0"
description = "Local, general-purpose RAG (retrieval-augmented generation) library. Point it at any folder, get a searchable, incrementally-updated index back."
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "numpy",
]

[project.optional-dependencies]
answer = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
